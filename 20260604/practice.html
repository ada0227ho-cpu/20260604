<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>MindAR 六張名片互動示範</title>

<script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
}
</style>
</head>

<body>

<a-scene
mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: true; uiError: true; uiScanning: true;"
color-space="sRGB"
renderer="colorManagement: true; physicallyCorrectLights: true"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false"
>

<a-assets>
  <img id="card1" src="card1.jpg">
  <img id="card2" src="card2.jpg">
  <img id="card3" src="card3.jpg">
  <img id="card4" src="card4.jpg">
  <img id="card5" src="card5.jpg">
  <img id="card6" src="card6.jpg">
</a-assets>

<a-light type="ambient" intensity="3"></a-light>

<a-camera look-controls="enabled: false"></a-camera>

<!-- IMG_1 -->
<a-entity mindar-image-target="targetIndex: 0">
  <a-plane
    src="#card1"
    width="1.2"
    height="0.7"
    position="0 0 0"
    touch-transform>
  </a-plane>
</a-entity>

<!-- IMG_2 -->
<a-entity mindar-image-target="targetIndex: 1">
  <a-plane
    src="#card2"
    width="1.2"
    height="0.7"
    position="0 0 0"
    touch-transform>
  </a-plane>
</a-entity>

<!-- IMG_3 -->
<a-entity mindar-image-target="targetIndex: 2">
  <a-plane
    src="#card3"
    width="1.2"
    height="0.7"
    position="0 0 0"
    touch-transform>
  </a-plane>
</a-entity>

<!-- IMG_4 -->
<a-entity mindar-image-target="targetIndex: 3">
  <a-plane
    src="#card4"
    width="1.2"
    height="0.7"
    position="0 0 0"
    touch-transform>
  </a-plane>
</a-entity>

<!-- IMG_5 -->
<a-entity mindar-image-target="targetIndex: 4">
  <a-plane
    src="#card5"
    width="1.2"
    height="0.7"
    position="0 0 0"
    touch-transform>
  </a-plane>
</a-entity>

<!-- IMG_6 -->
<a-entity mindar-image-target="targetIndex: 5">
  <a-plane
    src="#card6"
    width="1.2"
    height="0.7"
    position="0 0 0"
    touch-transform>
  </a-plane>
</a-entity>

</a-scene>

<script>
AFRAME.registerComponent('touch-transform', {
  init: function () {
    const el = this.el;

    this.defaultScale = el.object3D.scale.x;
    this.currentScale = this.defaultScale;
    this.prevDistance = null;
    this.prevAngle = null;
    this.lastTap = 0;

    el.addEventListener('click', () => {
      const now = Date.now();

      if (now - this.lastTap < 300) {
        el.object3D.scale.set(
          this.defaultScale,
          this.defaultScale,
          this.defaultScale
        );

        el.object3D.rotation.set(0, 0, 0);

        this.currentScale = this.defaultScale;
      }

      this.lastTap = now;
    });

    const waitCanvas = () => {
      const canvas = el.sceneEl.canvas;

      if (!canvas) {
        requestAnimationFrame(waitCanvas);
        return;
      }

      canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;

          this.prevDistance = Math.hypot(dx, dy);
          this.prevAngle = Math.atan2(dy, dx);
        }
      });

      canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2 && this.prevDistance !== null) {

          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;

          const dist = Math.hypot(dx, dy);
          const angle = Math.atan2(dy, dx);

          const scaleFactor = dist / this.prevDistance;

          this.currentScale *= scaleFactor;

          this.currentScale = Math.min(
            Math.max(this.currentScale, 0.5),
            3
          );

          el.object3D.scale.set(
            this.currentScale,
            this.currentScale,
            this.currentScale
          );

          const deltaAngle = angle - this.prevAngle;

          el.object3D.rotation.z += deltaAngle;

          this.prevDistance = dist;
          this.prevAngle = angle;

          e.preventDefault();
        }
      }, { passive: false });

      canvas.addEventListener('touchend', () => {
        this.prevDistance = null;
        this.prevAngle = null;
      });
    };

    waitCanvas();
  }
});
</script>

</body>
</html>
